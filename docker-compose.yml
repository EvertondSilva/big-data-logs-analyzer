
version: '3.8'


services:

  db:
    container_name: nasa-postgres-db

    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nasa-network
  api:
    build: .
    container_name: nasa-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nasa-network
    command: python api.py

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: nasa-dashboard
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "8050:8050"
    depends_on:
      - db
      - api
    networks:
      - nasa-network


volumes:
  postgres_data:


networks:
  nasa-network:
    driver: bridge
